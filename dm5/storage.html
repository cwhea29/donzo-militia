<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#9a8456">
<title>Donzo — Storage</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/DM_2.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pg">
<div class="pc">

  <div class="ph">
    <div class="ph-main">
      <div class="pt">Storage</div>
      <div class="ps">Manage the crew's stored items. Add or remove quantities — every action is recorded.</div>
    </div>
    <div class="pv">LEVEL 2+</div>
  </div>

  <div class="psec">
    <div class="account-card">
      <div class="account-card-title">Manage Stock</div>

      <div class="store-form">
        <div class="fg">
          <label for="store-item">Item</label>
          <select id="store-item">
            <option value="">Loading items…</option>
          </select>
        </div>

        <div class="fg">
          <label for="store-qty">Quantity</label>
          <input type="number" id="store-qty" min="1" step="1" value="1" placeholder="How many?">
        </div>
      </div>

      <div class="store-actions">
        <button type="button" class="btn btn-primary btn-sm" id="store-add-btn" onclick="DM.storage.adjust('add')">＋ Add to Storage</button>
        <button type="button" class="btn btn-ghost btn-sm" id="store-remove-btn" onclick="DM.storage.adjust('remove')">－ Remove from Storage</button>
      </div>
      <div class="account-status" id="store-status"></div>
    </div>
  </div>

  <div class="psec">
    <div class="audit-toolbar">
      <div class="audit-toolbar-meta">
        <span class="account-card-title" style="margin:0;padding:0;border:0;">Current Inventory</span>
        <span class="audit-count" id="store-count">—</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="store-refresh-btn" type="button" onclick="DM.storage.load()">↻ Refresh</button>
    </div>
    <div id="store-inventory-wrap">
      <div class="audit-loading">// LOADING INVENTORY...</div>
    </div>
  </div>

</div>

<div class="toast" id="storage-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/storage.js"></script>
<script src="js/nav.js"></script>
<script>
  initDB();
  DM.nav.init();
  DM.storage.init();
</script>
</body>
</html>
