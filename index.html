<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donzo — Operations</title>
<link rel="stylesheet" href="dm5/css/style.css">
<style>
  body.landing {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .landing-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 55% at 65% 22%, rgba(154,132,86,.08) 0%, transparent 55%),
      radial-gradient(ellipse 45% 35% at 8% 78%, rgba(154,132,86,.04) 0%, transparent 50%);
  }
  .landing-wrap {
    position: relative; z-index: 1;
    max-width: 560px;
    padding: 48px 32px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--tan);
    background: var(--panel);
    box-shadow: 0 24px 56px rgba(0,0,0,.4);
    animation: boxIn .45s var(--ease-out);
  }
  .landing-org {
    font-family: var(--font-h);
    font-size: clamp(48px, 10vw, 64px);
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text);
    line-height: .9;
    margin-bottom: 6px;
  }
  .landing-tag {
    font-family: var(--font-m);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .landing-desc {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-dim);
    margin-bottom: 32px;
    max-width: 44ch;
  }
  .landing-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; }
  .landing-actions .btn-primary { flex: 1; min-width: 180px; justify-content: center; }
  .landing-actions .btn-ghost { flex: 1; min-width: 140px; justify-content: center; }
  .landing-meta {
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--font-m);
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    line-height: 1.7;
  }
  .landing-meta a { color: var(--tan-lt); }
  .landing-meta code {
    font-family: var(--font-m);
    font-size: 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 2px 6px;
    color: var(--tan-lt);
  }
</style>
</head>
<body class="landing">
<div class="landing-bg"></div>
<div class="landing-wrap">
  <div class="landing-org">DONZO</div>
  <div class="landing-tag">GTA V ROLEPLAY · OPS MAP</div>

  <p class="landing-desc">
    A shared live map for Los Santos and Cayo Perico. Mark locations, tag groups, leave notes, and plan heists — visibility locked to your clearance level.
  </p>

  <div class="landing-actions">
    <a class="btn btn-primary" href="dm5/index.html">Sign In</a>
    <a class="btn btn-ghost" href="dm5/map.html">Open Map</a>
  </div>

  <div class="landing-meta">
    App files live in <code>/dm5/</code>. Setup and deployment notes in <a href="README.md">README.md</a>.
  </div>
</div>
</body>
</html>
